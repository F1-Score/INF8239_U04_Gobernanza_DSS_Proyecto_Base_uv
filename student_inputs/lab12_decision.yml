# Decisión contextual — LAB12
priority_harm: "Que casos positivos que necesitan revisión queden sin detectar, sobre todo si esto ocurre más en un grupo que en otro."
primary_metric: "Recall (TPR) global y brecha de recall entre G1 y G2; la brecha de FPR se usa como métrica complementaria."
tolerance: "Recall mínimo 0.68, brecha de recall máxima 0.16 y brecha de FPR máxima 0.16 (configs/governance.yml)."
